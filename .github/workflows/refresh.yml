name: Refresh Pokémon prices
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh retailer observations
        run: python scripts/monitor.py
      - name: Publish feed with conflict-safe retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pokemon30-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            # Another run or repository edit may have advanced main after checkout.
            # Recheck on the latest main instead of force-pushing or rebasing generated JSON.
            git fetch origin main
            git reset --hard origin/main
            python scripts/monitor.py
            git add data/feed.json data/history.json data/price-history.json
            if git diff --cached --quiet; then
              echo "No feed changes to publish."
              exit 0
            fi
            git commit -m "data: refresh retailer observations"
            if git push origin HEAD:main; then
              echo "Published feed on attempt $attempt."
              exit 0
            fi
            echo "Remote advanced during publish; retrying on latest main ($attempt/4)."
            sleep $((attempt * 3))
          done
          echo "Feed publication failed after four retries." >&2
          exit 1
