name: Refresh Pokémon prices
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-price-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Refresh retailer observations
        run: python scripts/monitor.py
      - name: Publish feed
        run: |
          git config user.name "pokemon30-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/history.json data/price-history.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh retailer observations"
            git push
          fi
